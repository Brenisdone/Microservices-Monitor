apiVersion: apps/v1
kind: Deployment

metadata:
  name: microservices-monitor

spec:
  replicas: 2

  selector:
    matchLabels:
      app: microservices-monitor

  template:
    metadata:
      labels:
        app: microservices-monitor

    spec:
      containers:
        - name: dashboard
          image: ghcr.io/brenisdone/microservices-monitor:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8501

          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 30
            periodSeconds: 10