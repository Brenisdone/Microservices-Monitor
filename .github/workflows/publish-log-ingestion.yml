
name: Publish Log Ingestion Image

on:
  push:
    branches:
      - feature/real-log-ingestion
    paths:
      - "log_ingestion/**"
      - ".github/workflows/publish-log-ingestion.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ./log_ingestion
          file: ./log_ingestion/Dockerfile
          push: true
          tags: |
            ghcr.io/brenisdone/microservices-monitor-log-ingestion:latest
            ghcr.io/brenisdone/microservices-monitor-log-ingestion:${{ github.sha }}
